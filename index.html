<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link rel="stylesheet" href="style.css">
    <script src="index.js" defer></script>
</head>
<body>
    <header>
        <div class="header-title-container">
            <h1 class="header-title">Pokédex</h1>
            <!-- Image generated by AI.
            Prompt I used: Generate a transparent background PNG of a Pokéball. -->
            <img src="images/pokeball-transparent-background.png" alt="Pokéball" class="pokeball-image">
        </div>
        <p id="data-source">Data from <a id="data-source-link" href="https://pokeapi.co/">PokéAPI</a></p>
    </header>

    <main>
        <section class="search-section">
            <h2 id="search-title">Find a Pokémon</h2>
            <div id="search-box">
                <input type="text" id="search" placeholder="Search example: Bulbasaur, bulbasaur or 1">
                <button id="search-button">
                    <!-- Image generated by AI.
                    Prompt I used: Generate a plain magnifying glass PNG for the search button. -->
                    <img id="search-icon" src="images/search-icon.png" alt="Search">
                </button>
            </div>
            <p class="search-error hidden">Please enter a valid Pokémon name or number.</p>
        </section>

        <div class="pokemon-section"></div>

        <div class="pagination-section">
            <button id="prev-button">&lt;</button>
            <input type="number" id="page-input" value="1">
            <button id="next-button">&gt;</button>
        </div>


        <div class="pokemon-info hidden"></div>
    </main>

    <footer>
        <p>Pokédex &copy; 2026</p>
    </footer>
</body>
</html>
