<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link rel="stylesheet" href="style.css">
    <script src="index.js" defer></script>
</head>
<body>
    <header>
        <h1>Pokédex</h1>
        <p id="data-source">Data from <a id="data-source-link" href="https://pokeapi.co/">PokéAPI</a></p>
    </header>

    <main>
        <section id="search-section">
            <h2 id="search-title">Find a Pokémon</h2>
            <div id="search-box">
                <input type="text" id="search" placeholder="Enter a Pokémon name or number" />
                <button id="search-button">
                    <!-- Image generated by AI.
                    Prompt I used: Generate a plain magnifying glass PNG for the search button. -->
                    <img id="search-icon" src="images/search-icon.png" alt="Search" />
                </button>
            </div>
        </section>

        <section class="pokemon-section"></section>

        <section class="pagination-section">
            <button id="prev-button"><</button>
            <input type="number" id="page-input" value="1" />
            <button id="next-button">></button>
        </section>
    </main>

    <footer>
        <p>Pokédex &copy; 2026</p>
    </footer>
</body>
</html>
