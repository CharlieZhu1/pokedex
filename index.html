<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link rel="stylesheet" href="style.css">
    <script src="index.js" defer></script>
</head>
<body>
    <header>
        <h1>Pokédex</h1>
        <p>Data from <a href="https://pokeapi.co/">PokéAPI</a></p>
    </header>

    <main>
        <section id="search-section">
            <h2>Find a Pokémon</h2>
            <input type="text" id="search" placeholder="Enter a Pokémon name or number" />
            <button id="search-button">Search</button>
        </section>

        <section id="pokemon-section">
            <div id="pokemon-card"></div>
        </section>

        
    </main>
</body>
</html>
